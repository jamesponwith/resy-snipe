# resy-snipe watch -config <this file>
#
# Long-running process that watches a Gmail inbox for Resy NotifyMe
# alert emails and books matching reservations. One process supervises
# every entry below; they share one IMAP connection.
#
# Run it with:
#
#     export RESY_SNIPE_IMAP_PASS='<your Gmail app password>'
#     resy-snipe watch -config docs/examples/watch.toml
#
# To survive shell exit (recommended for multi-day windows):
#
#     nohup resy-snipe watch -config docs/examples/watch.toml \
#         > watch.log 2>&1 &
#     echo "watch PID: $!"
#
# Prerequisite: each `user` below must have a stored Resy session.
# Either run `resy-snipe login -user <email> -token-env RESY_AUTH_TOKEN`
# once, or simply export RESY_AUTH_TOKEN — watch auto-seeds a session
# from it when the store has none.
#
# SAFE FIRST RUN: set `dry_run = true` below to validate the whole path
# (alert → Find → PrepareSlot → book_token mint) WITHOUT placing a real
# reservation. The snipe ends Canceled (reason=dry_run_armed). Flip it
# off once you've confirmed an alert arms cleanly.

imap_addr         = "imap.gmail.com:993"
imap_user         = "jponwith@sandiego.edu"
imap_pass_env     = "RESY_SNIPE_IMAP_PASS"
mailbox           = "INBOX"
min_poll_interval = "3s"          # tighter than the 5s default for drop-day responsiveness
# dry_run         = true          # arm-only: never POST /3/book (validation)

# Each [[watches]] entry is one NotifyMeRelease snipe. The display name
# must match what Resy puts in the alert email body for that venue —
# the parser uses it (case-insensitive) to route the alert to this
# entry. If you're unsure of the exact wording, run a 30s probe with
# -release-strategy=notify-me and watch the parser logs.

# 4 Charles Prime Rib — Sunday, June 14 2026. Drop is expected tomorrow
# (May 25); ongoing NotifyMe alerts catch cancellations through the
# reservation date. Brunch and dinner slots in one entry — engine
# books the first available match.
[[watches]]
venue_id     = 834
venue_name   = "4 Charles Prime Rib"
date         = "2026-06-14"
party_size   = 2
res_times    = [
  # brunch 11:00–16:00
  "11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00",
  # dinner 17:00–21:00
  "17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00",
]
retry_window = "530h"            # ~22 days; covers from now through end-of-day June 14
user         = "jponwith@sandiego.edu"
